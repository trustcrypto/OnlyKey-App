name: Build Release

on:
  push:
    branches-ignore:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: ${{ runner.os }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis
          }

      # Full install so the pinned NW.js 0.104.1 runtime is downloaded.
      # Use the production (non-SDK) build — tray/HID regressions show up there.
      - name: Install dependencies
        run: npm ci

      # release:skip-audit skips "npm audit" (not useful for CI test builds).
      # Internally calls "npm run build" (Vite) then stages + packages.
      - name: Build release package
        run: npm run release:skip-audit

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlykey-installer-${{ runner.os }}
          path: releases/*
          if-no-files-found: error
          retention-days: 14
