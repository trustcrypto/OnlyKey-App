name: Desktop

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
      - 'release/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Full install so the pinned NW.js 0.104.1 runtime is downloaded.
      # Use the production (non-SDK) build — tray/HID regressions show up there.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:desktop

      - name: Desktop tests
        if: runner.os != 'Linux'
        run: npm run test:desktop
