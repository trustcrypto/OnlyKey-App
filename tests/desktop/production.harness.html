<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OnlyKey Production Bootstrap Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Mirrors dist/index.html bootstrap after vite build.
      if (typeof nw !== 'undefined') {
        try {
          var win = nw.Window.get();
          var showWin = function () {
            try {
              if (localStorage.getItem('onlykeySuppressShow') === '1') return;
            } catch (e) {}
            if (win.isMinimized && win.restore) win.restore();
            if (!win.isVisible) win.show(true);
            win.focus();
          };
          showWin();
          win.on('focus', showWin);
          win.on('restore', showWin);

          var appRoot = nw.App.startPath;
          require(require('path').join(appRoot, 'desktopBg.cjs')).start();
        } catch (e) {
          console.error('NW desktop bootstrap failed:', e);
        }
      }
    </script>
    <script>
      (async function verify() {
        const fs = require('fs');
        const path = require('path');
        const resultArg = (nw.App.argv || []).find((arg) => arg.startsWith('--onlykey-test-result='));
        const resultPath = resultArg
          ? resultArg.slice('--onlykey-test-result='.length)
          : path.join(nw.App.startPath, 'tmp', 'desktop-test-result.json');

        const result = {
          ok: false,
          scenario: 'production.bootstrap',
          state: null,
          error: null,
        };

        function finish(exitCode) {
          fs.mkdirSync(path.dirname(resultPath), { recursive: true });
          fs.writeFileSync(resultPath, JSON.stringify(result, null, 2));
          if (exitCode === 0) {
            require(path.join(nw.App.startPath, 'desktopBg.cjs')).dispatchTrayCommand('quit');
          } else {
            nw.App.quit();
            setTimeout(() => process.exit(exitCode), 200);
          }
        }

        const { createTrayTestHelpers } = require(path.join(
          nw.App.startPath,
          'tests/desktop/tray-test-helpers.js'
        ));
        const { waitForTrayReady } = createTrayTestHelpers(nw, fs, path);

        try {
          await waitForTrayReady(8000);
          await new Promise((resolve) => setTimeout(resolve, 500));
          const desktop = require(path.join(nw.App.startPath, 'desktopBg.cjs'));
          result.state = desktop.getTestState();
          result.ok =
            result.state.started &&
            result.state.trayInMainContext &&
            result.state.closeHandlerBound &&
            result.state.iconExists;
        } catch (error) {
          result.error = String(error);
        }

        finish(result.ok ? 0 : 1);
      })();
    </script>
  </body>
</html>
